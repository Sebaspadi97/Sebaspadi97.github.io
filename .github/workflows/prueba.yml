name: Prueba de compilación

# Compila cualquier rama distinta de main sin publicar, para revisar cambios antes de unirlos.
on:
  push:
    branches-ignore: [main, qa, qa-reports]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar sin publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Guardar el resultado en la rama prueba-dist (para revisarlo)
        run: |
          cd dist
          git init -q -b prueba-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Compilación de ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prueba-dist
