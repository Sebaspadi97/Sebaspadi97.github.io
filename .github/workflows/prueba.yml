name: Prueba de compilación

# Compila cualquier rama distinta de main sin publicar, para revisar cambios antes de unirlos.
on:
  push:
    branches-ignore: [main, qa, qa-reports, prueba-dist, lockfile]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar sin publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Probar la sincronización de proyectos (sin guardar)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: node scripts/sync/sincronizar-proyectos.mjs
      - name: Probar un proyecto de ejemplo traído con la plantilla
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PRUEBA_PLANTILLA: '1'
          PRUEBA_REPO: ${{ github.event.repository.name }}
          PRUEBA_REF: ${{ github.ref_name }}
        run: |
          node scripts/sync/sincronizar-proyectos.mjs
          test -f src/content/proyectos/es/nombre-corto-del-caso.md
          test -f public/img/proyectos/nombre-corto-del-caso/01-grafico-principal.webp
          test -f public/img/proyectos/nombre-corto-del-caso/01-grafico-principal-700.webp
      - run: npm run build
      - name: Comprobar que el proyecto de ejemplo se publicó (y quitarlo de la vista previa)
        run: |
          test -f dist/es/proyectos/nombre-corto-del-caso/index.html
          test -f dist/en/projects/short-case-name/index.html
          echo "La plantilla se publicó en español e inglés."
          rm -rf dist/es/proyectos/nombre-corto-del-caso dist/en/projects/short-case-name
      - name: Guardar el resultado en la rama prueba-dist (para revisarlo)
        run: |
          cd dist
          git init -q -b prueba-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Compilación de ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prueba-dist
